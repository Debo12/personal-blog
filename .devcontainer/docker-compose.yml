version: "3.9"

services:

  backend:
    build:
      context: ..
      dockerfile: docker/backend/Dockerfile

    container_name: fastapi_blog

    working_dir: /workspace/backend

    volumes:
      - ..:/workspace

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql+asyncpg://blog:blog@postgres:5432/blog_db
      REDIS_URL: redis://redis:6379

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - blog-network

  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: fastapi_blog_db

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog"]
      interval: 5s
      retries: 20

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - blog-network

volumes:
  postgres-data:
  node_modules:

networks:
  blog-network: